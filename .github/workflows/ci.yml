name: CI — Data Contract Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-cd/tests/requirements.txt

      - name: Verify notebooks are not corrupted
        run: |
          python - <<'PY'
          import json, glob
          files = glob.glob('pipelines/**/*.ipynb', recursive=True)
          if not files:
              print('No .ipynb files found under pipelines/ — skipping')
          for f in files:
              json.load(open(f))
              print('valid:', f)
          PY

      - name: Run data contract tests
        env:
          DATABRICKS_HOST:      ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:     ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: pytest ci-cd/tests/ -v --tb=short
