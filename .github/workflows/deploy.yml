name: CD — Deploy to Databricks

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy notebooks to the workspace
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks workspace import-dir pipelines \
            /Workspace/Shared/metadata_governance/pipelines \
            --overwrite
